# Local development and test services.
#
# `postgres`      — the development database, persisted in a named volume.
# `postgres-test` — the database the integration suite runs against. It lives on
#                   tmpfs and is wiped on every restart: no fsync, no durability,
#                   nothing worth keeping. `pnpm test` starts it on its own.
# `adminer`       — a browser over both databases. Not needed by anything: the
#                   other services are started by name, so it only comes up when
#                   asked for (`pnpm db:ui`).
# `mailpit`       — the mailbox the sign-in emails land in, in development and
#                   under test. Without a password, the email *is* the way in
#                   (docs/stack-technique.md §4bis), so it is not a convenience:
#                   it is the only way to exercise that path at all. SMTP on
#                   1025, a web inbox on 8025, and an HTTP API the integration
#                   suite reads the six-digit code from. Nothing is persisted —
#                   messages live in memory and go with the container.
#
# Both images must match the production major version (docs/adr/0002).

name: ppfq

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppfq
      POSTGRES_PASSWORD: ppfq
      POSTGRES_DB: ppfq
      # Deterministic collation: index order must not depend on the host locale.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images want the mount at /var/lib/postgresql, not at
      # /var/lib/postgresql/data: the data lives in a version-named subdirectory
      # so that `pg_upgrade --link` does not cross a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ppfq -d ppfq']
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppfq
      POSTGRES_PASSWORD: ppfq
      POSTGRES_DB: ppfq_test
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    # Throwaway data: keep it in RAM and turn off the durability machinery.
    tmpfs:
      - /var/lib/postgresql
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
      - -c
      - max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ppfq -d ppfq_test']
      interval: 1s
      timeout: 3s
      retries: 60

  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      # Pre-filled on the login form; `postgres-test` is reachable under that
      # same name from the server field. Credentials: ppfq / ppfq.
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    environment:
      # A throwaway inbox: nothing is written to disk, and everything is
      # accepted — no TLS to negotiate, no credentials to configure on the two
      # sides that have to agree.
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_HTTP_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
